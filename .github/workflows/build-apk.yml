name: Build unsigned APK

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Gradle command
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            sudo apt-get update
            sudo apt-get install -y gradle
            echo "GRADLE_CMD=gradle" >> $GITHUB_ENV
          fi

      - name: Build release (unsigned) APK
        run: $GRADLE_CMD :app:assembleRelease --no-daemon --stacktrace

      - name: List generated APKs
        run: ls -R app/build/outputs || true

      - name: Upload unsigned APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-unsigned-apk
          path: |
            app/build/outputs/**/*.apk
