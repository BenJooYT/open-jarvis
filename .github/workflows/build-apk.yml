name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        build-type: [ release, debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            curl -sSL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --no-daemon
            chmod +x ./gradlew
          fi

      - name: Build ${{ matrix.build-type }} APK
        run: ./gradlew :app:assemble${{ matrix.build-type == 'release' && 'Release' || 'Debug' }} --no-daemon --stacktrace

      - name: Collect APKs and checksums
        run: |
          mkdir -p dist
          find app/build/outputs -name '*.apk' -type f | while read -r apk; do
            cp "$apk" dist/
          done
          cd dist
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload ${{ matrix.build-type }} APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-${{ matrix.build-type }}-apk
          path: |
            dist/**/*.apk
            dist/**/*.sha256
          if-no-files-found: error
          retention-days: 30